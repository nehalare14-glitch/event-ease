<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EventEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f1ff;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: min(90%, 400px);
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .login-card h1 {
            margin-bottom: 8px;
            color: #5635b5;
        }

        .login-card p {
            color: #777;
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            margin: 15px 0 7px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .login-card button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6846ce;
            color: white;
            font-weight: bold;
        }

        .message {
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .error { background: #ffe6e6; color: #a00000; }
        .success { background: #e5ffe9; color: #176b2b; }

        .register-link {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
<style>
.google-login-section {
    text-align: center;
    margin: 16px 0;
}

.login-divider {
    color: #888;
    font-size: 12px;
    margin-bottom: 12px;
}

.google-login-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 16px;
    width: auto;
    background: white;
    color: #333;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}

.google-login-btn:hover {
    background: #f7f4ff;
    border-color: #6843d0;
}

.google-login-btn img {
    width: 18px;
    height: 18px;
}

#googleLoginError {
    color: #c62828;
    font-size: 12px;
}
</style>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>

<div class="login-card">

    <h1>EventEase</h1>
    <p>Sign in to manage your events.</p>

    <div th:if="${param.error}" class="message error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="message success">
        You have logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter username"
               required
               autocomplete="username">

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter password"
               required
               autocomplete="current-password">

        <div style="margin:16px 0; display:flex; align-items:center; gap:10px;">
    <input type="checkbox"
           id="adminLogin"
           name="adminLogin"
           value="true"
           style="width:18px; height:18px; accent-color:#6843d1;">
    <label for="adminLogin" style="margin:0;">
        Login as Admin
    </label>
</div>
<button type="submit">Sign In</button>

    </form>
<div class="google-login-section">
    <div class="login-divider">OR</div>

    <button type="button"
            id="googleLoginBtn"
            class="google-login-btn">

        <img
            src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
            alt=""
            width="18"
            height="18">

        <span>Continue with Google</span>
    </button>

    <p id="googleLoginError" role="alert"></p>
</div>

    <a class="register-link" th:href="@{/register}">
        Create a user account
    </a>

</div>

<script type="module" src="/js/firebase-google-login.js"></script>



</body>
</html>
