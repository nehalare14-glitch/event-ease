<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EventEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f1ff;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: min(90%, 400px);
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .login-card h1 {
            margin-bottom: 8px;
            color: #5635b5;
        }

        .login-card p {
            color: #777;
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            margin: 15px 0 7px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .login-card button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6846ce;
            color: white;
            font-weight: bold;
        }

        .message {
            margin: 12px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .error { background: #ffe6e6; color: #a00000; }
        .success { background: #e5ffe9; color: #176b2b; }

        .register-link {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">

    <h1>✦ EventEase</h1>
    <p>Sign in to manage your events.</p>

    <div th:if="${param.error}" class="message error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="message success">
        You have logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter username"
               required
               autocomplete="username">

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter password"
               required
               autocomplete="current-password">

        <button type="submit">Sign In</button>

    </form>

    <a class="register-link" th:href="@{/register}">
        Create a customer account
    </a>

</div>

</body>
</html>
